[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra-core"
version = "0.1.0"
description = "Local-first deterministic control plane for Claude Code agent organizations"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Orchestra Core contributors" }]
dependencies = []

[project.optional-dependencies]
tui = ["rich>=14,<15", "textual>=6,<8"]
dev = ["jsonschema>=4.18,<5"]

[project.scripts]
orchestra = "orchestra_core.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

